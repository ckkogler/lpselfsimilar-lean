version: v0.4
project:
  name: Lp densities of self-similar measures and Bernoulli convolutions
  description: >-
    An absolutely continuous self-similar measure on Euclidean space has an
    Lp density for some p greater than one. For an algebraic parameter lambda
    between one half and one, put B=(1+d+log M)/min(1,log M), where d is its
    degree and M its Mahler measure. The non-strict condition lambda>=1-B^(-3)
    gives an L2 density at lambda squared and a continuous compactly supported
    density at lambda. The exponent-100 criterion is also retained, including
    its endpoint. For reduced lambda=1-p/q, the condition p<=q/(2+log q)^3
    suffices; in particular every integer n>=588 gives continuity at 1-1/n.
    The library contains the quantitative reverse Holder, entropy, arithmetic,
    Gaussian, Fourier and concentration arguments underlying both proofs.
  authors: [Constantin Kogler]
  responsible_maintainers: [Constantin Kogler]
  license: 0BSD
classification:
  arxiv: [math.DS, math.PR]
  msc2020: [28A80, 42A38, 60G50]
sources:
  - title: On Lp density of self similar measures and Bernoulli convolutions
    authors: [Samuel Kittle, Constantin Kogler]
    type: paper
    relationship: formalizes
    location: Theorems 1.1–1.3, Corollary 1.4, Lemma 2.1, and the numbered results of Section 3
    note: >-
      Primary mathematical source. The revised reverse Holder constant is 18^d
      with its exact logarithmic exponent. The exponent-100 condition includes
      equality. The introduction's cubic claims agree with the second source.
      No unverified public publication identifier is asserted.
  - title: A cubic criterion for continuous algebraic Bernoulli convolutions
    authors: [Samuel Kittle, Constantin Kogler]
    type: paper
    relationship: formalizes
    location: Theorem 1.1, Corollary 1.2, Proposition 1.3, Sections 2–6 and Appendices A–B
    note: >-
      Primary source for the cubic proof, including the L2 conclusion at the
      squared parameter, continuous compactly supported density at the original
      parameter, rational consequence and every integer denominator at least 588.
      The threshold concerns the sufficient rational inequality, not necessity
      of continuity. Duplicate introduction statements are compared once.
  - title: Entropy of Bernoulli convolutions and uniform exponential growth for linear groups
    authors: [Emmanuel Breuillard, Péter P. Varjú]
    id: https://arxiv.org/abs/1510.04043v4
    type: paper
    relationship: adapts
    note: >-
      The required finite Gaussian comparison and quantitative entropy estimates
      are proved from canonical conjugate matrices and actual probability laws.
      No entropy theorem is assumed as an axiom.
  - title: Mutual information and minimum mean-square error in Gaussian channels
    authors: [Dongning Guo, Shlomo Shamai (Shitz), Sergio Verdú]
    type: paper
    relationship: adapts
    location: IEEE Transactions on Information Theory 51 (2005), 1261–1282, Theorem 1
    note: >-
      The scalar binary Gaussian identity needed here is proved directly for
      conditional expectation and variance. The full general channel theorem
      is not an additional formalization claim.
