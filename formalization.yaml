status:
  scope: >-
    The package combines both primary developments and the revised supporting
    statements. The five public introduction claims are independently stated in
    Challenge. Final compilation, semantic review, strict comparison and local
    policy checks of this revised snapshot are in progress; predecessor checks
    are not presented as evidence for changed sources.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [GPT-6 (Codex)]
      framework: Codex
      tool_setup: >-
        One coordinator and three concurrent agents develop and review the
        contained Lean implementation using compiler feedback, Mathlib tactics,
        source correspondence, axiom audits and independent kernel checking.
      prompting_notes: >-
        Preserve exact statements and constants, reuse existing proofs, adapt
        the revised results, attribute mathematics to Kittle–Kogler, and prepare
        a self-contained locally verified submission package.
  notes: >-
    Samuel Kittle and Constantin Kogler are credited for the primary mathematics.
    Constantin Kogler directs and maintains the formalization. Codex generated
    and revised Lean code and checking tools. No independent human review of
    the formalization is asserted; inference costs were not measured.
fidelity:
  divergences: >-
    Density statements use actual measure identities, fair-sign series laws and
    canonical algebraic invariants. Finite stopping words replace informal
    stopping-time descriptions. Revised supporting interfaces retain their
    constants and endpoints; proof variants and editorial corrections are
    documented in FORMALIZATION.md and provenance/SOURCE_NOTES.md. Historical
    exponent-50 and older reverse Holder statements remain in the proof library
    but are not extra public Challenge claims.
review:
  status: unchecked
  reviewers: []
  notes: >-
    Final cross-agent review and compilation of the revised snapshot are pending.
    Exact completed checks will be recorded in verification/. Local checking is
    distinct from hosted CI, registry review and independent human peer review.
